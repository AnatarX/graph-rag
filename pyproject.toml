[project]
name = "graph-rag"
version = "0.1.0"
description = "Mini GraphRAG over a small text corpus: embeddings, clustering, knowledge graph, hybrid retrieval, chat UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "streamlit>=1.38",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "rapidfuzz>=3.9",
    "kagglehub>=0.3",
    "typer>=0.12",
    "pyvis>=0.3.2",
    "faiss-cpu>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
